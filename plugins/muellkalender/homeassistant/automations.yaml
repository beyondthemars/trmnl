# In die bestehende automations.yaml einfügen; NICHT die Datei ersetzen.
# Voraussetzung: ein Waste-Collection-Schedule-Kalender mit Entity-ID calendar.abk_kiel.
- id: trmnl_muellkalender_kiel
  alias: 'TRMNL Müllkalender: ABK-Termine senden'
  description: 'Sendet die nächste Leerung von vier Abfallarten an den TRMNL-Webhook.'
  triggers:
    - trigger: time
      at: '06:10:00'
    - trigger: time
      at: '12:10:00'
    - trigger: homeassistant
      event: start
  conditions: []
  actions:
    - if:
        - condition: template
          value_template: "{{ trigger is defined and trigger.platform == 'homeassistant' }}"
      then:
        - delay: '00:02:00'
    - action: calendar.get_events
      target:
        entity_id: calendar.abk_kiel
      data:
        start_date_time: "{{ today_at('00:00') }}"
        duration:
          days: 90
      response_variable: abk_response
    - condition: template
      value_template: "{{ abk_response.get('calendar.abk_kiel', {}).get('events', []) | count > 0 }}"
    - action: rest_command.trmnl_muellkalender
      data:
        payload: >-
          {% set types = [
            {'id': 'rest', 'label': 'Restmüll', 'needle': 'rest'},
            {'id': 'paper', 'label': 'Papier', 'needle': 'papier'},
            {'id': 'bio', 'label': 'Biomüll', 'needle': 'bio'},
            {'id': 'yellow', 'label': 'Gelber Sack', 'needle': 'gelb'}
          ] %}
          {% set ns = namespace(bins=[], next_days=999) %}
          {% set events = abk_response['calendar.abk_kiel']['events'] | sort(attribute='start') %}
          {% for t in types %}
            {% set selected = namespace(event=none) %}
            {% for event in events %}
              {% if selected.event is none and t.needle in (event.summary | default('', true) | lower) %}
                {% set selected.event = event %}
              {% endif %}
            {% endfor %}
            {% if selected.event is not none %}
              {% set date = as_datetime(selected.event.start).date() %}
              {% set days = (date - now().date()).days %}
              {% set relative = 'Heute' if days == 0 else ('Morgen' if days == 1 else 'in ' ~ days ~ ' Tagen') %}
              {% set item = {
                'id': t.id, 'label': t.label,
                'date': date.strftime('%d.%m.'),
                'weekday': ['Mo','Di','Mi','Do','Fr','Sa','So'][date.weekday()],
                'days': days, 'relative': relative
              } %}
              {% if days >= 0 and days < ns.next_days %}
                {% set ns.next_days = days %}
              {% endif %}
            {% else %}
              {% set item = {
                'id': t.id, 'label': t.label,
                'date': '–', 'weekday': '', 'days': 999,
                'relative': 'Kein Termin'
              } %}
            {% endif %}
            {% set ns.bins = ns.bins + [item] %}
          {% endfor %}
          {{ {'merge_variables': {
             'bins': ns.bins,
             'next_days': ns.next_days,
             'generated_at': now().strftime('%d.%m.%Y %H:%M')
          }} | to_json }}
  mode: single
