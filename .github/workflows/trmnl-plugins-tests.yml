name: TRMNL X family dashboard checks
on:
  pull_request:
    paths:
      - 'projects/trmnl-x-familie/**'
      - '.github/workflows/trmnl-plugins-tests.yml'
  push:
    branches: [main]
    paths:
      - 'projects/trmnl-x-familie/**'
      - '.github/workflows/trmnl-plugins-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ABKI family project mock tests
        run: node projects/trmnl-x-familie/muellkalender/tests/test.mjs
      - name: Family weather mock tests
        run: node projects/trmnl-x-familie/wetter/tests/test.mjs
      - name: TRMNL X approved layout contract
        run: node projects/trmnl-x-familie/dashboard/tests/layout.test.mjs
